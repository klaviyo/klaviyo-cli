name: Sync OpenAPI spec

# Fetches the latest published Klaviyo OpenAPI spec, regenerates the resource
# commands, and opens a PR when anything changed. Modeled on the Stripe CLI's
# sync-openapi-artifacts workflow. The PR is the review gate for remote spec
# content entering the tree.

on:
  schedule:
    - cron: "0 6 * * 1-5" # weekday mornings UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Fetch latest stable spec
        run: curl -fsSL https://raw.githubusercontent.com/klaviyo/openapi/main/openapi/stable.json -o api/openapi/stable.json
      - name: Regenerate commands
        run: go generate ./...
      - name: Read spec revision
        id: revision
        # Validate the shape before it reaches GITHUB_OUTPUT: the value comes
        # from remote content, and an embedded newline could inject extra
        # outputs.
        run: |
          rev=$(python3 -c "import json,re,sys; v=json.load(open('api/openapi/stable.json'))['info']['version']; sys.exit('unexpected revision format: %r' % v) if not re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}', v) else print(v)")
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: bot/sync-openapi
          title: "Sync OpenAPI spec to revision ${{ steps.revision.outputs.revision }}"
          commit-message: "Sync OpenAPI spec to revision ${{ steps.revision.outputs.revision }}"
          body: |
            Automated spec sync from [klaviyo/openapi](https://github.com/klaviyo/openapi).

            Review the regenerated commands, then merge and tag a release to ship them.
