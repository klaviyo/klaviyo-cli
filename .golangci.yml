version: "2"

linters:
  # "standard" enables errcheck, govet, staticcheck, unused, ineffassign.
  default: standard
  enable:
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Terminal writes: nothing useful to do if stdout/stderr writes fail.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Idiomatic `defer resp.Body.Close()`.
        - (io.ReadCloser).Close

formatters:
  enable:
    - gofumpt
    - goimports
